name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    # The CMake presets target the Visual Studio 2022 generator explicitly.
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug --target negpar_inhomo negpar_tests -- /m:1

      - name: Test
        run: ctest --preset debug --output-on-failure
